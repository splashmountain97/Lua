<!doctype html>
<!-- The 1200×630 preview card, rendered by scripts/capture-og.mjs into
     site/img/og.png. The helmet drawing, pushed in a little on the visor, and
     the wordmark set in the site's own faces. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400&family=Source+Sans+3:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #F4EFE6; position: relative; }
  .art { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; overflow: hidden; }
  .cam { position: absolute; width: 1400px; height: calc(1400px / 1.8333); left: calc(760px - .5036 * 1400px); top: calc(315px - .4193 * 1400px / 1.8333); transform-origin: 50.36% 41.93%; transform: scale(1.25); }
  .cam img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .visor img { animation: none; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #F4EFE6 0%, #F4EFE6 30%, rgba(244,239,230,0) 62%); }
  .copy { position: absolute; left: 88px; top: 0; height: 630px; display: flex; flex-direction: column; justify-content: center; }
  .wm { font: 400 92px/1 "Newsreader", Georgia, serif; letter-spacing: -.03em; color: #2A2724; margin: 0 0 22px; }
  .tag { font: 400 30px/1.35 "Source Sans 3", sans-serif; color: #46423C; margin: 0; max-width: 420px; }
  .k { font: 500 14px/1 ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; color: rgba(42,39,36,.55); margin: 0 0 26px; }
</style>
</head>
<body>
  <div class="art">
    <div class="cam">
      <img class="bg" src="img/helmet-1800.jpg" alt="">
      <div class="visor"><img src="img/swirl.webp" alt=""></div>
      <div class="visor-glass"></div>
    </div>
    <div class="fade"></div>
  </div>
  <div class="copy">
    <p class="k">luadaily.com</p>
    <h1 class="wm">Lua</h1>
    <p class="tag">A question, once a day. Shake it, or tap it, and sit with what it asks.</p>
  </div>
</body>
</html>
